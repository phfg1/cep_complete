<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário frete</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <div class="container">
        <form>
            <div class="row mt-5"></div>
            <h4>Dados básicos</h4>
            <div class="row">
                <div class="col-4">
                    <input type="text" class="form-control" placeholder="Nome">
                </div>
                <div class="col-4">
                    <input type="text" class="form-control" placeholder="Sobrenome">
                </div>
                <div class="col-4">
                    <input type="email" class="form-control" placeholder="E-mail">
                </div>
            </div>
            <div class="row mt-3">
                <h4>Dados da entrega</h4>
            </div>
            <div class="row">
                <div class="col-4 d-flex">
                    <input type="text" class="form-control" placeholder="CEP" id="cep">
                    <button type="button" class="btn btn-primary ms-2" id="btn-buscar-cep">
                        <i class="bi bi-search"></i>
                        <span class="spinner-border spinner-border-sm d-none"></span>
                    </button>
                </div>
                <div class="col-6">
                    <input type="text" class="form-control" id="endereco" placeholder="Endereço">
                </div>
                <div class="col-2">
                    <input type="number" class="form-control" placeholder="Nº">
                </div>
            </div>
            <div class="row mt-3">
                <div class="col-4">
                    <input type="text" class="form-control" id="bairro" placeholder="Bairro">
                </div>
                <div class="col-4">
                    <input type="text" class="form-control" id="localidade" placeholder="Cidade">
                </div>
                <div class="col-4">
                    <input type="text" class="form-control" id="uf" placeholder="Estado">
                </div>
            </div>
            <button type="submit" class="btn btn-success mt-3">Enviar Pedido</button>
            <button type="reset" class="btn btn-danger mt-3">Cancelar</button>
        </form>
    </div>
    <script src="jquery.js"></script>
    <script src="jquery.mask.min.js"></script>
    <script src="main2.js"></script>    
</body>
</html>
